name: Playwright framework

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate framework
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_results: ${{ steps.detect-results.outputs.has_results }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Type-check framework
        run: npm run typecheck

      - name: Run available tests
        run: npm run test:ci

      - name: Detect Allure results
        id: detect-results
        if: always()
        shell: bash
        run: |
          if find allure-results -type f -print -quit 2>/dev/null | grep -q .; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload reports when tests exist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-and-allure-results
          path: |
            playwright-report/
            allure-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy-report:
    name: Publish Allure report
    needs: validate
    if: always() && needs.validate.outputs.has_results == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: playwright-and-allure-results
          path: artifacts

      - name: Generate Allure report
        run: npx allure generate artifacts/allure-results --clean -o allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

      - name: Deploy Allure report
        id: deployment
        uses: actions/deploy-pages@v4
